<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SCP Shooter</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a14;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            pointer-events: none;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 10;
            cursor: pointer;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── Start Screen ─────────────────────────────────────────────── */
        .start-screen {
            background: rgba(5, 5, 15, 0.75);
        }

        .game-title {
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            color: #4db8ff;
            text-shadow: 0 0 30px rgba(77, 184, 255, 0.5), 0 0 60px rgba(77, 184, 255, 0.2);
            margin-bottom: 0.2em;
        }

        .game-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.6rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #ff6b4a;
            text-shadow: 0 0 20px rgba(255, 107, 74, 0.4);
            margin-bottom: 2.5em;
        }

        .btn {
            padding: 0.8em 2.5em;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            border: 2px solid;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            background: transparent;
            outline: none;
        }

        .btn-primary {
            color: #4db8ff;
            border-color: #4db8ff;
            box-shadow: 0 0 15px rgba(77, 184, 255, 0.3), inset 0 0 15px rgba(77, 184, 255, 0.1);
        }

        .btn-primary:hover {
            background: rgba(77, 184, 255, 0.15);
            box-shadow: 0 0 25px rgba(77, 184, 255, 0.5), inset 0 0 25px rgba(77, 184, 255, 0.15);
            transform: scale(1.05);
        }

        .btn-danger {
            color: #ff4d4d;
            border-color: #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.3), inset 0 0 15px rgba(255, 77, 77, 0.1);
        }

        .btn-danger:hover {
            background: rgba(255, 77, 77, 0.15);
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.5), inset 0 0 25px rgba(255, 77, 77, 0.15);
            transform: scale(1.05);
        }

        .controls-info {
            margin-top: 2.5em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5em;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 0.8em;
            font-size: clamp(0.7rem, 1.5vw, 0.95rem);
            color: rgba(180, 190, 210, 0.7);
        }

        .key-badge {
            display: inline-block;
            padding: 0.15em 0.6em;
            border: 1px solid rgba(180, 190, 210, 0.4);
            border-radius: 3px;
            font-size: 0.85em;
            color: rgba(200, 210, 230, 0.9);
            background: rgba(255, 255, 255, 0.05);
            min-width: 2em;
            text-align: center;
        }

        /* ── HUD Overlay ──────────────────────────────────────────────── */
        .hud-overlay {
            pointer-events: none;
        }

        .hud-score {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 700;
            color: #50fa7b;
            text-shadow: 0 0 10px rgba(80, 250, 123, 0.4);
        }

        .hud-lives {
            position: absolute;
            top: 12px;
            left: 20px;
            display: flex;
            gap: 6px;
        }

        .life-icon {
            width: clamp(14px, 2vw, 20px);
            height: clamp(14px, 2vw, 20px);
            background: #ffd740;
            border: 2px solid #c8a400;
            box-shadow: 0 0 8px rgba(255, 215, 64, 0.4);
        }

        .hud-high-score {
            position: absolute;
            top: 40px;
            right: 20px;
            font-size: clamp(0.65rem, 1.3vw, 0.85rem);
            color: rgba(255, 215, 64, 0.6);
        }

        /* ── Game Over Screen ─────────────────────────────────────────── */
        .gameover-screen {
            background: rgba(5, 5, 15, 0.7);
        }

        .gameover-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            color: #ff4d4d;
            text-shadow: 0 0 30px rgba(255, 77, 77, 0.5), 0 0 60px rgba(255, 77, 77, 0.2);
            margin-bottom: 0.5em;
        }

        .gameover-score {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 600;
            color: #ffd740;
            text-shadow: 0 0 15px rgba(255, 215, 64, 0.4);
            margin-bottom: 0.3em;
        }

        .gameover-high {
            font-size: clamp(0.8rem, 1.8vw, 1.1rem);
            color: rgba(255, 215, 64, 0.6);
            margin-bottom: 2em;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.2s; opacity: 0; }
        .delay-2 { animation-delay: 0.4s; opacity: 0; }
        .delay-3 { animation-delay: 0.6s; opacity: 0; }
        .delay-4 { animation-delay: 1.2s; opacity: 0; }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" data-type="main" />
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay"></div>
    </div>

    <div id="ui-overlay"></div>

    <script>
        // Trunk stores WASM exports on window.wasmBindings
        function wasm() { return window.wasmBindings || {}; }
        function callWasm(name, fallback) {
            try {
                var fn = wasm()[name];
                return typeof fn === 'function' ? fn() : fallback;
            } catch(e) { return fallback; }
        }

        var overlay = document.getElementById('ui-overlay');

        function render(state, score, lives, high) {
            var html = '';
            if (state === 0) {
                html = '<div class="screen start-screen">' +
                    '<div class="game-title">SCP SHOOTER</div>' +
                    '<div class="game-subtitle">SIDE-SCROLLING COMBAT</div>' +
                    '<div class="btn btn-primary">START MISSION</div>' +
                    '<div class="controls-info">' +
                    '<div class="control-row"><span class="key-badge">A</span><span class="key-badge">D</span><span> / Arrow Keys — Move</span></div>' +
                    '<div class="control-row"><span class="key-badge">W</span><span class="key-badge">↑</span><span class="key-badge">SPACE</span><span> — Jump</span></div>' +
                    '<div class="control-row"><span class="key-badge">J</span><span class="key-badge">Z</span><span> — Shoot</span></div>' +
                    '</div></div>';
            } else if (state === 1) {
                var icons = '';
                for (var i = 0; i < lives; i++) icons += '<div class="life-icon"></div>';
                html = '<div class="screen hud-overlay">' +
                    '<div class="hud-lives">' + icons + '</div>' +
                    '<div class="hud-score">' + score + '</div>' +
                    (high > 0 ? '<div class="hud-high-score">HI ' + high + '</div>' : '') +
                    '</div>';
            } else if (state === 2) {
                html = '<div class="screen gameover-screen">' +
                    '<div class="gameover-title fade-in">MISSION FAILED</div>' +
                    '<div class="gameover-score fade-in delay-1">SCORE: ' + score + '</div>' +
                    (score >= high && score > 0 ? '<div class="gameover-high fade-in delay-2">★ NEW HIGH SCORE ★</div>' :
                     high > 0 ? '<div class="gameover-high fade-in delay-2">BEST: ' + high + '</div>' : '') +
                    '<div class="btn btn-danger fade-in delay-3">REPLAY</div>' +
                    '</div>';
            }
            overlay.innerHTML = html;
        }

        // Click handler on the overlay — works for any visible element
        overlay.addEventListener('mousedown', function(e) {
            var state = callWasm('get_game_state', 0);
            if (state === 0) callWasm('start_game');
            else if (state === 2) callWasm('restart_game');
        });

        var prevState = -1;
        function poll() {
            var state = callWasm('get_game_state', 0);
            var score = callWasm('get_score', 0);
            var lives = callWasm('get_lives', 3);
            var high = callWasm('get_high_score', 0);

            // Only re-render when state changes or during gameplay (score updates)
            if (state !== prevState || state === 1) {
                render(state, score, lives, high);
                prevState = state;
            }
        }

        setInterval(poll, 100);
    </script>
</body>
</html>
