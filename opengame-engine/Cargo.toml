[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/examples/pong",
    "crates/examples/platformer",
    "crates/examples/space-blitz",
    "crates/cli",
]

[workspace.dependencies]
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
glow = "0.16"
glam = { version = "0.29", features = ["serde"] }
log = "0.4"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
