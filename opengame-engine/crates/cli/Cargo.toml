[package]
name = "opengame-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for OpenGame Engine"

[[bin]]
name = "og"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
